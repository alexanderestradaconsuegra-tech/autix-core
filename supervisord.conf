[supervisord]
nodaemon=true
user=root
loglevel=info

# Nginx
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log
priority=999

# Core Server
[program:core-server]
directory=/app/apps/core-server
command=node dist/index.js
autostart=true
autorestart=true
startretries=3
startsecs=5
environment=NODE_ENV=production,PORT=4000,DISABLE_AUTH=true,POSTGRES_HOST=mercado-saas_merka-db,POSTGRES_PORT=5432,POSTGRES_DB=autix_core,POSTGRES_USER=merka_user,POSTGRES_PASSWORD=autix2026
stderr_logfile=/var/log/core-server-error.log
stdout_logfile=/var/log/core-server.log
priority=998

# Campolac Connector
[program:campolac-connector]
directory=/app/apps/campolac-connector
command=node dist/index.js
autostart=true
autorestart=true
startretries=3
startsecs=5
environment=NODE_ENV=production,PORT=4200,CORE_SERVER_URL=http://localhost:4000,POSTGRES_HOST=mercado-saas_merka-db,POSTGRES_PORT=5432,POSTGRES_DB=autix_core,POSTGRES_USER=merka_user,POSTGRES_PASSWORD=autix2026
stderr_logfile=/var/log/connector-error.log
stdout_logfile=/var/log/connector.log
priority=997
