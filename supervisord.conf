[supervisord]
nodaemon=true
user=root
loglevel=info

# Nginx
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/err.log
stdout_logfile=/var/log/nginx/out.log

# Core Server
[program:core-server]
directory=/app/apps/core-server
command=node dist/index.js
autostart=true
autorestart=true
environment=PORT=4000,DISABLE_AUTH=true,POSTGRES_USER=postgres,POSTGRES_DB=autix_core
stderr_logfile=/var/log/core-server-err.log
stdout_logfile=/var/log/core-server.log

# Campolac Connector
[program:campolac-connector]
directory=/app/apps/campolac-connector
command=node dist/index.js
autostart=true
autorestart=true
environment=PORT=4200,CORE_SERVER_URL=http://localhost:4000
stderr_logfile=/var/log/connector-err.log
stdout_logfile=/var/log/connector.log
